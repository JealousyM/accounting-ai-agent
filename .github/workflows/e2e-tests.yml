name: E2E Tests

on:
  workflow_dispatch: # Manual run only

env:
  NODE_VERSION: '18'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install --with-deps chromium
      
      - name: Setup database
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/accounting_db_test
        run: |
          npx prisma generate
          npx prisma db push --force-reset --accept-data-loss
          npx prisma db seed
      
      - name: Build packages
        run: npm run build
      
      - name: Start services
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/accounting_db_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_min_32_characters_long
          REFRESH_TOKEN_SECRET: test_refresh_secret_key_min_32_characters_long
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NODE_ENV: test
        run: |
          npm run dev &
          sleep 10
      
      - name: Run E2E tests
        working-directory: packages/web
        run: npm run test:e2e
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 30
      
      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: packages/web/test-results
          retention-days: 7
