name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  NODE_VERSION: '18'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test-api:
    name: Test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/accounting_db_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_min_32_characters_long
          REFRESH_TOKEN_SECRET: test_refresh_secret_key_min_32_characters_long
          NODE_ENV: test
        run: |
          echo "Checking database connection..."
          npx prisma db execute --stdin <<< "SELECT version();"
          echo "Generating Prisma client..."
          npx prisma generate
          echo "Pushing database schema..."
          npx prisma db push --force-reset --accept-data-loss
          echo "Seeding database..."
          npx prisma db seed

      - name: Run API tests
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/accounting_db_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_min_32_characters_long
          REFRESH_TOKEN_SECRET: test_refresh_secret_key_min_32_characters_long
          NODE_ENV: test
        run: npm run test:ci

  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Web tests
        working-directory: packages/web
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-api, test-web]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # The VPS builds the api + web Docker images on-server (scripts/deploy.sh);
          # the web `next build` (compile + typecheck) alone can approach 10m on this
          # budget box, so the combined build was overrunning the default and getting
          # killed mid-typecheck. 20m gives on-server builds headroom.
          command_timeout: 20m
          script: |
            cd /opt/accounting-ai-agent
            bash scripts/deploy.sh

      - name: Verify deployment
        run: |
          sleep 10
          echo "Checking API health..."
          curl -f --retry 5 --retry-delay 5 https://api.eksiegowyai.pl/health || echo "API health check failed"
          echo "Checking Web..."
          curl -f --retry 5 --retry-delay 5 -o /dev/null -s -w "Web status: %{http_code}\n" https://eksiegowyai.pl || echo "Web check failed"
