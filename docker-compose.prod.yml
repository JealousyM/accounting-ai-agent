version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - accounting-network

  redis:
    image: redis:7-alpine
    container_name: accounting-redis-prod
    restart: unless-stopped
    networks:
      - accounting-network

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: accounting-api-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - accounting-network

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: accounting-web-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - accounting-network

  nginx:
    image: nginx:alpine
    container_name: accounting-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - accounting-network

volumes:
  postgres_data_prod:

networks:
  accounting-network:
    driver: bridge
