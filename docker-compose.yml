version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: accounting-db
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: accounting-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: accounting-api
    environment:
      NODE_ENV: development
      PORT: 3011
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/accounting_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
    ports:
      - "3011:3011"
    volumes:
      - ./packages/api:/app/packages/api
      - /app/packages/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: accounting-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3011
    ports:
      - "3010:3010"
    volumes:
      - ./packages/web:/app/packages/web
      - /app/packages/web/node_modules
      - /app/packages/web/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
