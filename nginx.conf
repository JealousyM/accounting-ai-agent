worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=marketing_api:10m rate=10r/s;

    # HTTP — ACME challenge + redirect to HTTPS
    server {
        listen 80;
        server_name eksiegowyai.pl api.eksiegowyai.pl emarketingai.pl www.emarketingai.pl;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==================== eksiegowyai.pl ====================

    server {
        listen 443 ssl;
        server_name eksiegowyai.pl;

        ssl_certificate     /etc/letsencrypt/live/eksiegowyai.pl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eksiegowyai.pl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        resolver 127.0.0.11 valid=30s;
        set $upstream_web http://web:3000;
        set $upstream_api_internal http://api:3001;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass $upstream_api_internal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            proxy_pass $upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    server {
        listen 443 ssl;
        server_name api.eksiegowyai.pl;

        ssl_certificate     /etc/letsencrypt/live/eksiegowyai.pl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eksiegowyai.pl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        resolver 127.0.0.11 valid=30s;
        set $upstream_api http://api:3001;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ==================== emarketingai.pl ====================

    # Redirect www -> apex
    server {
        listen 443 ssl;
        server_name www.emarketingai.pl;

        ssl_certificate     /etc/letsencrypt/live/emarketingai.pl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/emarketingai.pl/privkey.pem;

        return 301 https://emarketingai.pl$request_uri;
    }

    # Main marketing-ai app
    server {
        listen 443 ssl;
        server_name emarketingai.pl;

        ssl_certificate     /etc/letsencrypt/live/emarketingai.pl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/emarketingai.pl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL2:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        resolver 127.0.0.11 valid=30s;
        set $upstream_mktai_web http://marketing-ai-web-prod:3000;
        set $upstream_mktai_api http://marketing-ai-api-prod:3000;

        location /api/ {
            limit_req zone=marketing_api burst=20 nodelay;
            proxy_pass $upstream_mktai_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            proxy_pass $upstream_mktai_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
